<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZentraMC | Login</title>
<link rel="stylesheet" href="style.css">

<style>
.auth-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,0,90,.16),transparent 35%),
    radial-gradient(circle at 80% 70%,rgba(140,0,255,.18),transparent 40%),
    #050507;
}
.auth-card{
  width:min(430px,100%);
  padding:38px 30px;
  border:1px solid rgba(255,0,120,.25);
  border-radius:24px;
  background:rgba(15,10,20,.82);
  box-shadow:0 0 70px rgba(170,0,255,.15);
  animation:authIn .7s cubic-bezier(.16,1,.3,1);
}
.auth-card h1{
  text-align:center;
  font-size:34px;
  margin:0 0 8px;
}
.auth-card h1 span{
  background:linear-gradient(90deg,#ff005d,#a500ff);
  -webkit-background-clip:text;
  color:transparent;
}
.auth-sub{
  text-align:center;
  color:#888;
  margin-bottom:30px;
}
.auth-card input{
  width:100%;
  box-sizing:border-box;
  padding:15px;
  margin:8px 0;
  border:1px solid #302235;
  border-radius:12px;
  background:#09070c;
  color:white;
  outline:none;
}
.auth-card input:focus{
  border-color:#e000ff;
  box-shadow:0 0 20px rgba(200,0,255,.15);
}
.auth-btn{
  width:100%;
  border:0;
  margin-top:15px;
  padding:15px;
  border-radius:12px;
  color:white;
  font-weight:800;
  background:linear-gradient(90deg,#ff005d,#a500ff);
  cursor:pointer;
  transition:.25s;
}
.auth-btn:hover{transform:translateY(-2px);box-shadow:0 10px 35px rgba(220,0,180,.3)}
.auth-msg{text-align:center;margin-top:15px;color:#aaa;min-height:22px}
.auth-links{text-align:center;margin-top:22px;color:#777}
.auth-links a{color:#e100ff;text-decoration:none}
@keyframes authIn{
 from{opacity:0;transform:translateY(30px) scale(.96)}
 to{opacity:1;transform:none}
}
</style>
</head>

<body>
<div class="auth-page">
  <div class="auth-card">
    <h1>WELCOME TO <span>ZENTRAMC</span></h1>
    <div class="auth-sub">Login to your ZentraMC account</div>

    <form id="loginForm">
      <input id="email" type="email" placeholder="Email address" required>
      <input id="password" type="password" placeholder="Password" required>

      <button class="auth-btn" type="submit">LOGIN</button>
      <div class="auth-msg" id="msg"></div>
    </form>

    <div class="auth-links">
      Don't have an account?
      <a href="signup.html">Create one</a>
    </div>
  </div>
</div>

<script src="auth.js"></script>

<script>
document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();

  const msg = document.getElementById("msg");
  msg.textContent = "Logging in...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  while (!window.supabase) {
    await new Promise(r => setTimeout(r,100));
  }

  const client = window.supabase.createClient(
    "https://huueufghgmizeqfkpbgw.supabase.co",
    "sb_publishable_aC933vkswRIPBZgltA0XoQ_KR5P9wdO"
  );

  const { error } = await client.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    msg.textContent = error.message;
    return;
  }

  const params = new URLSearchParams(location.search);
  location.href = params.get("redirect") || "index.html";
});
</script>
</body>
</html>
