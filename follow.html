<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZentraMC — Follow Us</title>

<link rel="stylesheet" href="style.css">

<style>

.follow-wrap{
  max-width:950px;
  margin:0 auto;
}

.follow-hero{
  text-align:center;
  margin-bottom:55px;
}

.follow-hero .mini{
  color:#b000ff;
  font-size:10px;
  font-weight:900;
  letter-spacing:3px;
}

.follow-hero h1{
  margin:10px 0 12px;
  font-size:clamp(42px,8vw,76px);
  font-weight:900;
  line-height:.95;
}

.follow-hero p{
  max-width:580px;
  margin:auto;
  color:#77717d;
  font-size:13px;
  line-height:1.7;
}

.follow-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.follow-card{
  position:relative;
  overflow:hidden;
  min-height:260px;
  padding:32px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  text-decoration:none;
  border:1px solid rgba(255,255,255,.08);
  border-radius:26px;
  background:
    radial-gradient(circle at 90% 0%,rgba(165,0,255,.16),transparent 45%),
    linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.012));
  transition:.4s cubic-bezier(.16,1,.3,1);
}

.follow-card:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-80px;
  bottom:-90px;
  border-radius:50%;
  background:rgba(165,0,255,.16);
  filter:blur(35px);
  transition:.4s;
}

.follow-card:hover{
  transform:translateY(-9px);
  border-color:rgba(190,70,255,.45);
  box-shadow:
    0 25px 70px rgba(0,0,0,.4),
    0 0 45px rgba(165,0,255,.12);
}

.follow-card:hover:after{
  transform:scale(1.4);
}

.follow-icon{
  position:relative;
  z-index:2;
  width:68px;
  height:68px;
  display:grid;
  place-items:center;
  border-radius:20px;
  color:#fff;
  font-size:27px;
  font-weight:900;
  background:linear-gradient(135deg,#ff075f,#a500ff);
  box-shadow:0 0 35px rgba(190,0,255,.25);
}

.follow-info{
  position:relative;
  z-index:2;
  margin-top:30px;
}

.follow-name{
  color:#fff;
  font-size:25px;
  font-weight:900;
}

.follow-handle{
  margin-top:6px;
  color:#77717d;
  font-size:11px;
}

.follow-bottom{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:25px;
}

.follow-action{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 16px;
  border-radius:10px;
  color:#fff;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  text-decoration:none;
  background:linear-gradient(90deg,#ff075f,#a500ff);
  transition:.25s;
}

.follow-action:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(165,0,255,.25);
}

.follow-arrow{
  color:#c252ff;
  font-size:23px;
}

.follow-note{
  text-align:center;
  margin-top:45px;
  color:#625d68;
  font-size:10px;
  letter-spacing:.5px;
}

@media(max-width:700px){

  .follow-grid{
    grid-template-columns:1fr;
  }

  .follow-card{
    min-height:230px;
    padding:27px;
  }

}

</style>
</head>

<body>

<div id="header"></div>

<main class="page">

<div class="follow-wrap">

  <div class="follow-hero">

    <div class="mini">
      ZENTRAMC COMMUNITY
    </div>

    <h1>
      FOLLOW <span class="gradient">US.</span>
    </h1>

    <p>
      Stay connected with ZentraMC.
      Get updates, announcements, clips and everything happening across the network.
    </p>

  </div>


  <div class="follow-grid">

    <div class="follow-card">

      <div class="follow-icon">◎</div>

      <div class="follow-info">

        <div class="follow-name">
          Instagram
        </div>

        <div class="follow-handle">
          @zentramcofficial
        </div>

      </div>

      <div class="follow-bottom">

        <a
          class="follow-action"
          href="https://www.instagram.com/zentramcofficial?stkn=N2JpM2M5bTlia29v"
          target="_blank"
          rel="noopener noreferrer"
        >
          FOLLOW NOW
        </div>

        <div class="follow-arrow">
          ↗
        </div>

      </div>

    </div>


    <div class="follow-card">

      <div class="follow-icon">▶</div>

      <div class="follow-info">

        <div class="follow-name">
          YouTube
        </div>

        <div class="follow-handle">
          ZentraMC Official
        </div>

      </div>

      <div class="follow-bottom">

        <a
          class="follow-action"
          href="https://www.youtube.com/@ZentraMCOfficial"
          target="_blank"
          rel="noopener noreferrer"
        >
          SUBSCRIBE
        </div>

        <div class="follow-arrow">
          ↗
        </div>

      </div>

    </div>

  </div>


  <div class="follow-note">
    MORE ZENTRAMC SOCIALS COMING SOON
  </div>

</div>

</main>

<div id="footer"></div>

<script>

fetch("header.html?v=3", {cache:"no-store"})
.then(r => r.text())
.then(html => {
  document.getElementById("header").innerHTML = html;

  if(typeof initNavigation === "function")
    initNavigation();

  if(typeof setActivePage === "function")
    setActivePage();
});

fetch("footer.html")
.then(r => r.text())
.then(html => {
  document.getElementById("footer").innerHTML = html;
});

</script>

<script src="script.js"></script>
<script src="auth.js"></script>

</body>
</html>
